<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIS Timetable - Empty Rooms</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --success: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--card-bg);
      padding: 16px 24px;
      font-size: 20px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
    }
    header span { color: var(--accent); }
    .container { padding: 24px; max-width: 900px; margin: 0 auto; }
    .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    select {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }
    select:focus { border-color: var(--accent); }
    .status { margin-bottom: 16px; font-size: 14px; color: var(--text-sub); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .card {
      padding: 16px;
      border-radius: 8px;
      border: 1px solid rgba(34, 197, 94, 0.3);
      background: rgba(34, 197, 94, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .room-title { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
    .badge {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
    }
    .empty { color: var(--text-sub); }
  </style>
</head>
<body>

<header>BIS <span>Timetable</span> · Empty rooms</header>

<div class="container">
  <div class="controls">
    <select id="daySelect"></select>
    <select id="periodSelect"></select>
  </div>

  <div class="status" id="statusMsg">Загрузка…</div>
  <div class="grid" id="output"></div>
</div>

<script>
  let data = null;
  let busy = new Set();

  const key = (d, p, r) => d + '\u0001' + p + '\u0001' + r;
  const daySel = document.getElementById('daySelect');
  const perSel = document.getElementById('periodSelect');

  function fill(select, items) {
    select.replaceChildren(...items.map(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      return o;
    }));
  }

  // Текущий день/период по времени Бишкека — только если совпадает с данными с сайта
  function pickDefaults() {
    const now = new Date();
    const wd = new Intl.DateTimeFormat('en-US', { weekday: 'short', timeZone: 'Asia/Bishkek' }).format(now).toLowerCase();
    const hm = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Bishkek' }).format(now);
    const mins = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
    const nowM = mins(hm);

    const day = data.days.find(d => d.toLowerCase().startsWith(wd));
    if (day) daySel.value = day;

    const per = data.periods.find(p => {
      const m = p.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
      return m && nowM >= mins(m[1]) && nowM < mins(m[2]);
    });
    if (per) perSel.value = per;
  }

  function render() {
    const day = daySel.value, period = perSel.value;
    const free = data.rooms.filter(r => !busy.has(key(day, period, r)));
    const out = document.getElementById('output');
    out.replaceChildren();
    if (!free.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = 'Свободных кабинетов нет.';
      out.append(d);
    } else {
      free.forEach(room => {
        const card = document.createElement('div');
        card.className = 'card';
        const t = document.createElement('div');
        t.className = 'room-title'; t.textContent = room;
        const b = document.createElement('div');
        b.className = 'badge'; b.textContent = 'Free';
        card.append(t, b);
        out.append(card);
      });
    }
    const upd = new Date(data.updated).toLocaleString('ru-RU', { timeZone: 'Asia/Bishkek' });
    document.getElementById('statusMsg').textContent =
      `${day}, ${period}: свободно ${free.length} из ${data.rooms.length}. Данные обновлены: ${upd}`;
  }

  async function init() {
    try {
      const resp = await fetch('data.json?v=' + Date.now(), { cache: 'no-store' });
      if (!resp.ok) throw new Error(resp.status);
      data = await resp.json();
      busy = new Set(data.busy.map(([d, p, r]) => key(d, p, r)));
      fill(daySel, data.days);
      fill(perSel, data.periods);
      pickDefaults();
      daySel.onchange = perSel.onchange = render;
      render();
    } catch (e) {
      document.getElementById('statusMsg').textContent = 'Не удалось загрузить data.json: ' + e.message;
    }
  }
  init();
</script>
</body>
</html>
