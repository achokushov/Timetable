<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIS Free Rooms</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #22c55e;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { font-size: 24px; margin-bottom: 8px; color: var(--text); }
    p.subtitle { color: var(--text-sub); margin-top: 0; margin-bottom: 24px; }
    .select-group {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    select {
      flex: 1;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }
    select:focus { border-color: var(--accent); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 12px;
    }
    .room-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 10px;
      text-align: center;
    }
    .room-card.free {
      border-color: rgba(34, 197, 94, 0.4);
      background: rgba(34, 197, 94, 0.05);
    }
    .room-number {
      font-size: 20px;
      font-weight: bold;
      color: var(--text);
    }
    .status {
      font-size: 13px;
      color: var(--accent);
      margin-top: 4px;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Поиск свободных кабинетов BIS</h1>
  <p class="subtitle">Выберите день и время, чтобы увидеть доступные комнаты</p>

  <div class="select-group">
    <select id="daySelect" onchange="calculateEmptyRooms()">
      <option value="Monday">Monday (Понедельник)</option>
      <option value="Tuesday">Tuesday (Вторник)</option>
      <option value="Wednesday">Wednesday (Среда)</option>
      <option value="Thursday">Thursday (Четверг)</option>
      <option value="Friday">Friday (Пятница)</option>
    </select>

    <select id="timeSelect" onchange="calculateEmptyRooms()">
      <option value="08:30 - 09:15">08:30 - 09:15</option>
      <option value="09:20 - 10:05">09:20 - 10:05</option>
      <option value="10:25 - 11:10">10:25 - 11:10</option>
      <option value="11:15 - 12:00">11:15 - 12:00</option>
      <option value="12:55 - 13:40">12:55 - 13:40</option>
      <option value="13:45 - 14:30">13:45 - 14:30</option>
      <option value="14:35 - 15:20">14:35 - 15:20</option>
    </select>
  </div>

  <div class="grid" id="roomsOutput">Загрузка данных...</div>
</div>

<script>
  let allRooms = [];
  let busySlots = [];

  async function init() {
    try {
      const res = await fetch('./data.json?v=' + new Date().getTime());
      const data = await res.json();

      allRooms = data.all_rooms || [];
      busySlots = data.busy_slots || [];

      calculateEmptyRooms();
    } catch(e) {
      document.getElementById('roomsOutput').innerHTML = 
        '<div style="color:var(--text-sub)">Ошибка загрузки данных. Запустите Action в GitHub.</div>';
    }
  }

  function calculateEmptyRooms() {
    const selectedDay = document.getElementById('daySelect').value.toLowerCase();
    const selectedTime = document.getElementById('timeSelect').value;

    // Находим занятые комнаты в выбранное время
    const busyRooms = busySlots
      .filter(s => s.Day.toLowerCase().includes(selectedDay) && s.Time.includes(selectedTime))
      .map(s => s.Room);

    // Свободные = Все кабинеты минус Занятые
    const emptyRooms = allRooms.filter(room => !busyRooms.includes(room));

    const output = document.getElementById('roomsOutput');

    if (!emptyRooms.length) {
      output.innerHTML = '<div style="color:var(--text-sub); grid-column: 1/-1;">Нет свободных кабинетов на это время.</div>';
      return;
    }

    output.innerHTML = emptyRooms.map(room => `
      <div class="room-card free">
        <div class="room-number">Каб. ${room}</div>
        <div class="status">Свободен</div>
      </div>
    `).join('');
  }

  init();
</script>
</body>
</html>
