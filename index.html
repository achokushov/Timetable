<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIS Timetable - Empty Rooms</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --busy: #ef4444;
      --teacher: #a78bfa;
      --class: #38bdf8;
      --room: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--card-bg);
      padding: 16px 24px;
      font-size: 20px;
      font-weight: 700;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 16px;
    }
    header span { color: var(--accent); }
    #updated { font-size: 13px; font-weight: 500; color: var(--text-sub); }
    #updated.stale { color: #f59e0b; }
    nav {
      display: flex;
      background: #111827;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    nav a {
      color: var(--text-sub);
      padding: 14px 20px;
      font-size: 15px;
      text-decoration: none;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
    }
    nav a.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(56, 189, 248, 0.05);
    }
    .container { padding: 24px; max-width: 960px; margin: 0 auto; }
    .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    select, input[type=text] {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      font-family: inherit;
    }
    select:focus, input[type=text]:focus { border-color: var(--accent); }
    .status { margin-bottom: 16px; font-size: 14px; color: var(--text-sub); }
    .hint { margin: 0 0 16px; font-size: 14px; color: var(--text-sub); line-height: 1.5; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .card {
      padding: 16px;
      border-radius: 8px;
      border: 1px solid rgba(34, 197, 94, 0.3);
      background: rgba(34, 197, 94, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .room-title { font-weight: 600; font-size: 16px; overflow-wrap: anywhere; }
    .badge {
      background: rgba(34, 197, 94, 0.15);
      color: var(--success);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
    }
    .empty { color: var(--text-sub); }

    /* --- Find a slot --- */
    .search { position: relative; max-width: 520px; margin-bottom: 14px; }
    .search input { width: 100%; }
    .suggest {
      position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 10;
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
      max-height: 320px; overflow-y: auto; box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .suggest div {
      padding: 10px 14px; cursor: pointer; display: flex; justify-content: space-between;
      gap: 12px; font-size: 15px;
    }
    .suggest div.sel, .suggest div:hover { background: rgba(56, 189, 248, 0.12); }
    .suggest .none { color: var(--text-sub); cursor: default; }
    .kind { font-size: 12px; font-weight: 600; white-space: nowrap; }
    .kind.teacher { color: var(--teacher); }
    .kind.class { color: var(--class); }
    .kind.room { color: var(--room); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; min-height: 8px; }
    .chip {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 999px; padding: 6px 8px 6px 12px; font-size: 14px;
    }
    .chip.teacher { border-color: var(--teacher); }
    .chip.class { border-color: var(--class); }
    .chip.room { border-color: var(--room); }
    .chip button {
      background: none; border: 0; color: var(--text-sub); cursor: pointer;
      font-size: 18px; line-height: 1; padding: 0 4px;
    }
    .chip button:hover { color: var(--text); }
    .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
    table.slots { border-collapse: collapse; width: 100%; min-width: 640px; }
    table.slots th, table.slots td {
      border: 1px solid var(--border); padding: 8px; text-align: center; font-size: 13px;
    }
    table.slots th { background: var(--card-bg); font-weight: 600; }
    table.slots th.per {
      text-align: left; white-space: nowrap; position: sticky; left: 0; z-index: 1;
      background: var(--card-bg);
    }
    td.free { background: rgba(34, 197, 94, 0.22); color: var(--success); font-weight: 600; }
    td.busy { background: rgba(239, 68, 68, 0.10); color: #fca5a5; font-size: 12px; }
    td.busy small { display: block; color: var(--text-sub); font-size: 11px; line-height: 1.3; }
    .legend { margin-top: 12px; font-size: 13px; color: var(--text-sub); }
    .hidden { display: none; }
  </style>
</head>
<body>

<header><div>BIS <span>Timetable</span></div><div id="updated"></div></header>

<nav>
  <a href="#/empty" id="tabEmpty">Empty rooms</a>
  <a href="#/free" id="tabFree">Find a slot</a>
</nav>

<div class="container">

  <!-- Empty rooms -->
  <section id="viewEmpty">
    <div class="controls">
      <select id="daySelect"></select>
      <select id="periodSelect"></select>
    </div>
    <div class="status" id="statusMsg">Загрузка…</div>
    <div class="grid" id="output"></div>
  </section>

  <!-- Find a slot -->
  <section id="viewFree" class="hidden">
    <p class="hint">Add two or more teachers, classes or rooms. Green means every one of them has nothing timetabled then.</p>
    <div class="search">
      <input type="text" id="q" placeholder="Search a teacher, class or room…" autocomplete="off" spellcheck="false">
      <div class="suggest hidden" id="suggest"></div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="status" id="freeStatus"></div>
    <div class="tablewrap hidden" id="tableWrap"><table class="slots" id="slotsTable"></table></div>
    <div class="legend hidden" id="legend">Красные ячейки: под днём и периодом показано, кто из выбранных занят.</div>
  </section>

</div>

<script>
  let data = null;
  let busy = new Set();           // занятость кабинетов для вкладки Empty rooms
  let entities = [];              // {name, kind, slots:Set("d.p")}
  let selected = [];              // выбранные сущности

  const key = (d, p, r) => d + '\u0001' + p + '\u0001' + r;
  const $ = id => document.getElementById(id);
  const daySel = $('daySelect'), perSel = $('periodSelect');
  const KIND_LABEL = { teacher: 'Teacher', class: 'Class', room: 'Room' };

  function fill(select, items) {
    select.replaceChildren(...items.map(v => {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      return o;
    }));
  }

  /* ---------- Empty rooms ---------- */

  // Текущий день/период по времени Бишкека — только если совпадает с данными с сайта
  function pickDefaults() {
    const now = new Date();
    const wd = new Intl.DateTimeFormat('en-US', { weekday: 'short', timeZone: 'Asia/Bishkek' }).format(now).toLowerCase();
    const hm = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Bishkek' }).format(now);
    const mins = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
    const nowM = mins(hm);

    const day = data.days.find(d => d.toLowerCase().startsWith(wd));
    if (day) daySel.value = day;

    const per = data.periods.find(p => {
      const m = p.match(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/);
      return m && nowM >= mins(m[1]) && nowM < mins(m[2]);
    });
    if (per) perSel.value = per;
  }

  function renderEmpty() {
    const day = daySel.value, period = perSel.value;
    const free = data.rooms.filter(r => !busy.has(key(day, period, r)));
    const out = $('output');
    out.replaceChildren();
    if (!free.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = 'Свободных кабинетов нет.';
      out.append(d);
    } else {
      free.forEach(room => {
        const card = document.createElement('div');
        card.className = 'card';
        const t = document.createElement('div');
        t.className = 'room-title'; t.textContent = room;
        const b = document.createElement('div');
        b.className = 'badge'; b.textContent = 'Free';
        card.append(t, b);
        out.append(card);
      });
    }
    $('statusMsg').textContent =
      `${day}, ${period}: свободно ${free.length} из ${data.rooms.length}`;
  }

  function showUpdated() {
    const el = $('updated');
    const t = new Date(data.updated);
    if (isNaN(t)) return;
    el.textContent = 'Обновлено: ' + t.toLocaleString('ru-RU', {
      timeZone: 'Asia/Bishkek', day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
    // автообновление идёт каждые 6 часов; если данные старше 13 часов — что-то сломалось
    if (Date.now() - t.getTime() > 13 * 3600 * 1000) {
      el.classList.add('stale');
      el.textContent += ' · данные могли устареть';
    }
  }

  /* ---------- Поиск ---------- */

  const TRANSLIT = { а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'i',к:'k',л:'l',м:'m',
    н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'ts',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'i',ь:'',
    э:'e',ю:'iu',я:'ia' };

  // Приводим к «фонетическому» виду, чтобы Alexander ≈ Aleksandr, Sheyerman ≈ Sheerman
  function fold(s) {
    s = s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
    s = s.replace(/[а-яё]/g, c => TRANSLIT[c] ?? c);
    return s.replace(/x/g, 'ks').replace(/kh/g, 'h').replace(/ph/g, 'f').replace(/[yj]/g, 'i')
            .replace(/w/g, 'v').replace(/c(?![h])/g, 'k').replace(/[^a-z0-9 ]+/g, ' ')
            .replace(/(.)\1+/g, '$1').trim();
  }

  function lev(a, b) {
    const m = a.length, n = b.length;
    let prev = Array.from({ length: n + 1 }, (_, j) => j);
    for (let i = 1; i <= m; i++) {
      const cur = [i];
      for (let j = 1; j <= n; j++) {
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      prev = cur;
    }
    return prev[n];
  }

  // Стоимость совпадения слова запроса с названием: 0 — подстрока/начало слова, иначе расстояние
  function tokenCost(qt, ent) {
    if (ent.full.includes(qt)) return ent.words.some(w => w.startsWith(qt)) ? 0 : 0.5;
    if (qt.length < 3) return Infinity;
    const limit = qt.length >= 7 ? 2 : qt.length >= 4 ? 1 : 0;
    let best = Infinity;
    for (const w of ent.words) {
      const d = Math.min(lev(qt, w), lev(qt, w.slice(0, qt.length)) + 0.5);
      if (d < best) best = d;
    }
    return best <= limit ? best + 1 : Infinity;
  }

  function search(query) {
    const toks = fold(query).split(' ').filter(Boolean);
    if (!toks.length) return [];
    const chosen = new Set(selected.map(e => e.kind + e.name));
    const res = [];
    for (const ent of entities) {
      if (chosen.has(ent.kind + ent.name)) continue;
      let cost = 0;
      for (const t of toks) {
        const c = tokenCost(t, ent);
        if (c === Infinity) { cost = Infinity; break; }
        cost += c;
      }
      if (cost !== Infinity) res.push({ ent, cost });
    }
    res.sort((a, b) => a.cost - b.cost || a.ent.name.localeCompare(b.ent.name));
    return res.slice(0, 12).map(r => r.ent);
  }

  let suggestions = [], suggestIdx = -1;

  function renderSuggest() {
    const box = $('suggest'), q = $('q').value.trim();
    box.replaceChildren();
    if (!q) { box.classList.add('hidden'); return; }
    suggestions = search(q);
    suggestIdx = suggestions.length ? 0 : -1;
    if (!suggestions.length) {
      const d = document.createElement('div');
      d.className = 'none'; d.textContent = 'Ничего не найдено';
      box.append(d);
    }
    suggestions.forEach((ent, i) => {
      const d = document.createElement('div');
      if (i === suggestIdx) d.classList.add('sel');
      const n = document.createElement('span'); n.textContent = ent.name;
      const k = document.createElement('span'); k.className = 'kind ' + ent.kind; k.textContent = KIND_LABEL[ent.kind];
      d.append(n, k);
      d.onmousedown = e => { e.preventDefault(); addEntity(ent); };
      box.append(d);
    });
    box.classList.remove('hidden');
  }

  function moveSel(delta) {
    if (!suggestions.length) return;
    suggestIdx = (suggestIdx + delta + suggestions.length) % suggestions.length;
    [...$('suggest').children].forEach((c, i) => c.classList.toggle('sel', i === suggestIdx));
  }

  function addEntity(ent) {
    if (!selected.includes(ent)) selected.push(ent);
    $('q').value = '';
    $('suggest').classList.add('hidden');
    syncHash();
    renderFree();
  }

  function removeEntity(ent) {
    selected = selected.filter(e => e !== ent);
    syncHash();
    renderFree();
  }

  /* ---------- Find a slot ---------- */

  function renderFree() {
    const chips = $('chips');
    chips.replaceChildren();
    selected.forEach(ent => {
      const c = document.createElement('span');
      c.className = 'chip ' + ent.kind;
      const t = document.createElement('span'); t.textContent = ent.name;
      const k = document.createElement('span'); k.className = 'kind ' + ent.kind; k.textContent = KIND_LABEL[ent.kind];
      const x = document.createElement('button'); x.type = 'button'; x.textContent = '×'; x.title = 'Remove';
      x.onclick = () => removeEntity(ent);
      c.append(t, k, x);
      chips.append(c);
    });

    const wrap = $('tableWrap'), legend = $('legend'), st = $('freeStatus'), table = $('slotsTable');
    table.replaceChildren();
    if (selected.length < 1) {
      wrap.classList.add('hidden'); legend.classList.add('hidden');
      st.textContent = 'Выберите хотя бы одного — лучше двух и больше.';
      return;
    }

    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    const corner = document.createElement('th'); corner.className = 'per'; corner.textContent = 'Period';
    hr.append(corner);
    data.days.forEach(d => { const th = document.createElement('th'); th.textContent = d; hr.append(th); });
    thead.append(hr);
    const tbody = document.createElement('tbody');

    let freeCount = 0;
    data.periods.forEach((p, pi) => {
      const tr = document.createElement('tr');
      const th = document.createElement('th'); th.className = 'per'; th.textContent = p;
      tr.append(th);
      data.days.forEach((d, di) => {
        const td = document.createElement('td');
        const who = selected.filter(e => e.slots.has(di + '.' + pi));
        if (!who.length) {
          td.className = 'free'; td.textContent = 'Free'; freeCount++;
        } else {
          td.className = 'busy';
          td.textContent = `Busy ${who.length}/${selected.length}`;
          const sm = document.createElement('small');
          sm.textContent = who.map(e => e.name).join(', ');
          td.append(sm);
        }
        tr.append(td);
      });
      tbody.append(tr);
    });
    table.append(thead, tbody);
    wrap.classList.remove('hidden'); legend.classList.remove('hidden');
    st.textContent = `Свободно ${freeCount} слотов из ${data.days.length * data.periods.length}`
      + (selected.length < 2 ? ' (добавьте ещё, чтобы найти общее время)' : '');
  }

  /* ---------- Маршруты ---------- */

  function findByName(name) {
    const n = name.trim().toLowerCase();
    return entities.find(e => e.name.toLowerCase() === n);
  }

  function syncHash() {
    const h = '#/free' + (selected.length ? '/' + selected.map(e => encodeURIComponent(e.name)).join('+') : '');
    if (location.hash !== h) history.replaceState(null, '', h);
  }

  function route() {
    if (!data) return;
    const parts = (location.hash || '#/empty').split('/');   // ['#', 'free', 'A+B']
    const page = parts[1] === 'free' ? 'free' : 'empty';
    $('viewEmpty').classList.toggle('hidden', page !== 'empty');
    $('viewFree').classList.toggle('hidden', page !== 'free');
    $('tabEmpty').classList.toggle('active', page === 'empty');
    $('tabFree').classList.toggle('active', page === 'free');
    document.title = 'BIS Timetable - ' + (page === 'free' ? 'Find a slot' : 'Empty Rooms');
    if (page === 'free') {
      const raw = parts.slice(2).join('/');
      selected = raw ? raw.split('+').map(s => { try { return findByName(decodeURIComponent(s)); } catch (e) { return null; } })
                          .filter(Boolean) : [];
      renderFree();
    } else {
      renderEmpty();
    }
  }

  /* ---------- Старт ---------- */

  function slotSet(str) { return new Set(str ? str.split(' ') : []); }

  async function init() {
    try {
      const resp = await fetch('data.json?v=' + Date.now(), { cache: 'no-store' });
      if (!resp.ok) throw new Error(resp.status);
      data = await resp.json();

      busy = new Set(data.busy.map(([d, p, r]) => key(d, p, r)));
      fill(daySel, data.days);
      fill(perSel, data.periods);
      pickDefaults();
      daySel.onchange = perSel.onchange = renderEmpty;
      showUpdated();

      // сущности для поиска слотов
      const dayIdx = Object.fromEntries(data.days.map((d, i) => [d, i]));
      const perIdx = Object.fromEntries(data.periods.map((p, i) => [p, i]));
      const roomSlots = {};
      data.busy.forEach(([d, p, r]) => { (roomSlots[r] ??= new Set()).add(dayIdx[d] + '.' + perIdx[p]); });
      const make = (name, kind, slots) => { const f = fold(name); return { name, kind, slots, full: f, words: f.split(' ') }; };
      entities = [
        ...Object.entries(data.teachers || {}).map(([n, s]) => make(n, 'teacher', slotSet(s))),
        ...Object.entries(data.classes || {}).map(([n, s]) => make(n, 'class', slotSet(s))),
        ...data.rooms.map(n => make(n, 'room', roomSlots[n] || new Set())),
      ];

      const q = $('q');
      q.addEventListener('input', renderSuggest);
      q.addEventListener('focus', renderSuggest);
      q.addEventListener('blur', () => $('suggest').classList.add('hidden'));
      q.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
        else if (e.key === 'Enter') { e.preventDefault(); if (suggestions[suggestIdx]) addEntity(suggestions[suggestIdx]); }
        else if (e.key === 'Escape') { $('suggest').classList.add('hidden'); }
        else if (e.key === 'Backspace' && !q.value && selected.length) { removeEntity(selected[selected.length - 1]); }
      });

      window.addEventListener('hashchange', route);
      route();
    } catch (e) {
      $('statusMsg').textContent = 'Не удалось загрузить data.json: ' + e.message;
    }
  }
  init();
</script>
</body>
</html>
