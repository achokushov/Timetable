name: Auto Update BIS Timetable

on:
  schedule:
    - cron: '7,37 * * * *'  # проверка каждые 30 минут (сайт школы отвечает не всегда; данные обновляются, как только он ответил)
  workflow_dispatch:         # кнопка "Run workflow" для ручного запуска

permissions:
  contents: write            # без этого git push падает с 403

concurrency:
  group: timetable-update
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Run scraper
        run: python update.py

      - name: Commit and push changes
        if: always()          # сохраняем raw/ даже если парсер упал (для отладки)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json raw 2>/dev/null || git add data.json
          git commit -m "Автоматическое обновление расписания BIS" || exit 0
          git pull --rebase
          git push
